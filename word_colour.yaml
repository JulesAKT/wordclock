# A colour picker for one word group in the "Colour per Word" style.
#
# ESPHome has no colour entity, so this is an RGB light with dummy outputs:
# Home Assistant shows a colour wheel and brightness, and the clock reads
# the chosen colour back. Turning it off hides that word group.
#
# vars: id, name, red, green, blue (initial colour, 0-100%)

output:
  - platform: template
    id: ${id}_r
    type: float
    write_action: []
  - platform: template
    id: ${id}_g
    type: float
    write_action: []
  - platform: template
    id: ${id}_b
    type: float
    write_action: []

light:
  - platform: rgb
    id: ${id}
    name: ${name}
    icon: mdi:palette
    entity_category: config
    red: ${id}_r
    green: ${id}_g
    blue: ${id}_b
    gamma_correct: 1.0  # the display applies its own
    default_transition_length: 0s
    restore_mode: RESTORE_DEFAULT_ON
    initial_state:
      # Without a colour mode, ESPHome skips the colour and starts white.
      color_mode: rgb
      red: ${red}
      green: ${green}
      blue: ${blue}
